<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <!-- ORDER Strong Entity -->
  <rect x="50" y="80" width="120" height="60" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ORDER</text>
  
  <!-- Identifying Relationship (double diamond) -->
  <path d="M 170,110 L 230,110 L 270,90 L 310,110 L 270,130 Z" fill="white" stroke="#dc2626" stroke-width="2"/>
  <path d="M 175,110 L 225,110 L 265,93 L 305,110 L 265,127 Z" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="115" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold">HAS</text>
  <text x="195" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#dc2626">1</text>
  <text x="345" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#dc2626">N</text>
  
  <!-- ORDER_ITEM Weak Entity (double rectangle) -->
  <rect x="310" y="80" width="140" height="60" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="315" y="85" width="130" height="50" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="110" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">ORDER_ITEM</text>
  <text x="380" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#666" font-style="italic">(Weak Entity)</text>
  
  <!-- Connection lines -->
  <line x1="170" y1="110" x2="230" y2="110" stroke="#666" stroke-width="2"/>
  <line x1="310" y1="110" x2="370" y2="110" stroke="#666" stroke-width="2"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">Weak Entity Example</text>
  
  <!-- Legend -->
  <text x="250" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Single rectangle = Strong Entity | Double rectangle = Weak Entity</text>
  <text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Double diamond = Identifying Relationship</text>
  
  <!-- Annotations -->
  <text x="110" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#059669">OrderID (PK)</text>
  <text x="380" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#059669">ItemNumber (Partial Key)</text>
</svg>
