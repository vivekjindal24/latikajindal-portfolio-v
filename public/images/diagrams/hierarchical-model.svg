<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Root -->
  <rect x="200" y="20" width="100" height="40" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="5"/>
  <text x="250" y="45" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">University</text>
  
  <!-- Connection line from root -->
  <line x1="250" y1="60" x2="250" y2="90" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="90" x2="350" y2="90" stroke="#666" stroke-width="2"/>
  
  <!-- Department Level -->
  <line x1="150" y1="90" x2="150" y2="110" stroke="#666" stroke-width="2"/>
  <rect x="100" y="110" width="100" height="40" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" rx="5"/>
  <text x="150" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">CS Dept</text>
  
  <line x1="350" y1="90" x2="350" y2="110" stroke="#666" stroke-width="2"/>
  <rect x="300" y="110" width="100" height="40" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" rx="5"/>
  <text x="350" y="135" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Math Dept</text>
  
  <!-- Student Level - Left branch -->
  <line x1="150" y1="150" x2="150" y2="180" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="180" x2="200" y2="180" stroke="#666" stroke-width="2"/>
  
  <line x1="100" y1="180" x2="100" y2="200" stroke="#666" stroke-width="2"/>
  <rect x="60" y="200" width="80" height="35" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="100" y="222" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">John</text>
  
  <line x1="200" y1="180" x2="200" y2="200" stroke="#666" stroke-width="2"/>
  <rect x="160" y="200" width="80" height="35" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="200" y="222" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">Mary</text>
  
  <!-- Student Level - Right branch -->
  <line x1="350" y1="150" x2="350" y2="180" stroke="#666" stroke-width="2"/>
  <line x1="300" y1="180" x2="400" y2="180" stroke="#666" stroke-width="2"/>
  
  <line x1="300" y1="180" x2="300" y2="200" stroke="#666" stroke-width="2"/>
  <rect x="260" y="200" width="80" height="35" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="300" y="222" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">Alice</text>
  
  <line x1="400" y1="180" x2="400" y2="200" stroke="#666" stroke-width="2"/>
  <rect x="360" y="200" width="80" height="35" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="400" y="222" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">Bob</text>
  
  <!-- Title -->
  <text x="250" y="285" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">Hierarchical Database Model</text>
  
  <!-- Legend -->
  <text x="250" y="310" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Tree structure: Each child has only one parent</text>
  
  <!-- Level Labels -->
  <text x="20" y="45" font-family="Arial" font-size="10" fill="#666" font-style="italic">Root</text>
  <text x="20" y="135" font-family="Arial" font-size="10" fill="#666" font-style="italic">Level 1</text>
  <text x="20" y="222" font-family="Arial" font-size="10" fill="#666" font-style="italic">Level 2</text>
  
  <!-- Limitation Note -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#dc2626" font-style="italic">Limitation: Cannot handle many-to-many relationships efficiently</text>
  <text x="250" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#dc2626" font-style="italic">(e.g., John cannot belong to both CS and Math without duplication)</text>
</svg>
