<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Student Nodes -->
  <ellipse cx="100" cy="100" rx="60" ry="35" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">John</text>
  
  <ellipse cx="100" cy="250" rx="60" ry="35" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="100" y="255" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Mary</text>
  
  <!-- Course Nodes -->
  <ellipse cx="350" cy="80" rx="60" ry="35" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="350" y="85" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">CS101</text>
  
  <ellipse cx="350" cy="170" rx="70" ry="35" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="350" y="175" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MATH201</text>
  
  <ellipse cx="350" cy="270" rx="65" ry="35" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="350" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">PHY101</text>
  
  <!-- Department Nodes -->
  <rect x="490" y="65" width="90" height="50" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" rx="5"/>
  <text x="535" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">CS Dept</text>
  
  <rect x="470" y="245" width="110" height="50" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2" rx="5"/>
  <text x="525" y="270" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Physics Dept</text>
  
  <!-- Enrolls relationships (Student to Course) -->
  <!-- John to CS101 -->
  <line x1="160" y1="100" x2="290" y2="80" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="225" y="85" font-family="Arial" font-size="10" fill="#dc2626">enrolls</text>
  
  <!-- John to MATH201 -->
  <line x1="140" y1="120" x2="290" y2="160" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="215" y="145" font-family="Arial" font-size="10" fill="#dc2626">enrolls</text>
  
  <!-- Mary to PHY101 -->
  <line x1="160" y1="260" x2="290" y2="270" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="225" y="260" font-family="Arial" font-size="10" fill="#dc2626">enrolls</text>
  
  <!-- Mary to CS101 -->
  <line x1="130" y1="220" x2="310" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="220" y="155" font-family="Arial" font-size="10" fill="#dc2626">enrolls</text>
  
  <!-- Belongs to relationships (Student to Department) -->
  <!-- John to CS Dept -->
  <path d="M 140,120 Q 350,150 490,85" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  <text x="300" y="120" font-family="Arial" font-size="9" fill="#f59e0b">belongs to</text>
  
  <!-- Teaches relationships (Department to Course) -->
  <!-- CS Dept to CS101 -->
  <line x1="490" y1="85" x2="410" y2="80" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <text x="455" y="77" font-family="Arial" font-size="9" fill="#6366f1">teaches</text>
  
  <!-- Physics Dept to PHY101 -->
  <line x1="470" y1="270" x2="420" y2="270" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <text x="450" y="263" font-family="Arial" font-size="9" fill="#6366f1">teaches</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1e40af">Network Database Model</text>
  
  <!-- Legend -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">Graph structure with multiple parent-child relationships</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Blue = Students | Green = Courses | Purple = Departments</text>
  <text x="300" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">Supports many-to-many relationships natively</text>
</svg>
